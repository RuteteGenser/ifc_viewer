<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Argus, an IFC viewer. View IFC building models on your phone or computer. Open a file, orbit the 3D model and inspect its parts, all in the browser." />
    <meta property="og:title" content="Argus, IFC viewer" />
    <meta property="og:description" content="View IFC building models on your phone or computer. Open a file, orbit the 3D model and inspect its parts, all in the browser." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Argus, IFC viewer" />
    <meta name="theme-color" content="#fbfaf6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Argus" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/fraunces-latin.woff2" />
    <script>
      // ?demo=1: start the sample download now, in parallel with the app
      // code and the viewer engine (App.jsx picks the promise up).
      if (/[?&]demo=1(&|$)/.test(location.search)) {
        window.__demoIfc = fetch("%BASE_URL%demo/demo-building.ifc");
        window.__demoIfc.catch(function () {});
      }
    </script>
    <style>
      /* Self-hosted Fraunces (variable weight, Latin subset): no third-party
         connection or render-blocking stylesheet. */
      @font-face {
        font-family: Fraunces;
        font-style: normal;
        font-weight: 500 600;
        font-display: swap;
        src: url("%BASE_URL%fonts/fraunces-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* First paint: shown until React replaces the contents of #root. */
      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #fbfaf6;
        color: #2a2622;
        font: 600 20px Fraunces, Georgia, serif;
      }
      .splash svg {
        border-radius: 14px;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        50% { opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash svg { animation: none; }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Argus, IFC viewer</title>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#2a2622" />
          <path d="M3.5 16C8 9.2 12 7.6 16 7.6S24 9.2 28.5 16C24 22.8 20 24.4 16 24.4S8 22.8 3.5 16Z" fill="none" stroke="#fbfaf6" stroke-width="2" stroke-linejoin="round"/>
          <path d="M1.5 16H30.5" stroke="#fbfaf6" stroke-width="1.6"/>
          <circle cx="16" cy="16" r="4.6" fill="#96662c"/>
        </svg>
        <span>Argus</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
